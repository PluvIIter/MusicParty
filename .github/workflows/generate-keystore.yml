name: Generate Android Keystore

on:
  workflow_dispatch:
    inputs:
      store_pass:
        description: 'Keystore 存储密码（记下来，稍后填进 Secret）'
        required: true
      key_alias:
        description: 'Key 别名'
        required: true
        default: 'musicparty'
      key_pass:
        description: 'Key 密码（可与存储密码相同）'
        required: true

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore keystore.jks \
            -alias "${{ inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 -storetype JKS \
            -storepass "${{ inputs.store_pass }}" \
            -keypass "${{ inputs.key_pass }}" \
            -dname "CN=MusicParty,O=Thornex,C=CN"

      - name: Upload keystore (请下载备份，别丢)
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore
          path: keystore.jks

name: CI

on:
  pull_request:
    branches: [dev, master]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify（编译 + 单元测试）
        run: mvn -B -ntp verify

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music-party-web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: music-party-web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: 单元测试
        run: npm run test:run
      - name: 构建
        run: npm run build

  qqmusic-gateway:
    name: qqmusic-gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecars/qqmusic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q
      - name: Build private gateway image
        run: docker build -t musicparty-qqmusic:test .
      - name: Check private gateway health and authentication
        run: |
          docker run -d --name qqmusic-gateway-test -e QQMUSIC_GATEWAY_TOKEN=ci-private-gateway-token-123 musicparty-qqmusic:test
          trap 'docker rm -f qqmusic-gateway-test' EXIT
          docker cp smoke.py qqmusic-gateway-test:/tmp/smoke.py
          docker exec qqmusic-gateway-test python /tmp/smoke.py

  launcher-config:
    name: launcher-config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: go test -mod=mod ./pkg/config
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/sourceSettings.test.js
        working-directory: launcher/frontend

name: CI

on:
  pull_request:
    branches: [dev, master]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify（编译 + 单元测试）
        run: mvn -B -ntp verify

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music-party-web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: music-party-web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: 单元测试
        run: npm run test:run
      - name: 构建
        run: npm run build

  qqmusic-gateway:
    name: qqmusic-gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecars/qqmusic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q
      - name: Build private gateway image
        run: docker build -t musicparty-qqmusic:test .
      - name: Check private gateway health and authentication
        run: |
          docker run -d --name qqmusic-gateway-test -e QQMUSIC_GATEWAY_TOKEN=ci-private-gateway-token-123 musicparty-qqmusic:test
          trap 'docker rm -f qqmusic-gateway-test' EXIT
          docker cp smoke.py qqmusic-gateway-test:/tmp/smoke.py
          docker exec qqmusic-gateway-test python /tmp/smoke.py

  launcher-config:
    name: launcher-config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: go test -mod=mod -race ./pkg/config ./pkg/process ./pkg/launch
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.js
        working-directory: launcher/frontend

  launcher-qqmusic-bundle:
    name: launcher-qqmusic-bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Package and smoke-test embedded QQ runtime
        shell: pwsh
        run: |
          try {
            ./scripts/package-qqmusic.ps1 -OutputDir "${{ runner.temp }}/qqmusic-bundle"
          } catch {
            $diagnostic = ($_ | Format-List * -Force | Out-String)
            Write-Output "::error::$($diagnostic.Replace("`r", '').Replace("`n", '%0A'))"
            Write-Error $diagnostic -ErrorAction Continue
            $diagnostic | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            throw
          }
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Test Windows launcher service lifecycle
        working-directory: launcher
        env:
          QQMUSIC_TEST_BUNDLE: ${{ runner.temp }}/qqmusic-bundle
        run: go test -mod=mod ./pkg/config ./pkg/process ./pkg/launch
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Windows launcher with embedded gateway assets
        shell: pwsh
        run: |
          npm ci --prefix launcher/frontend
          npm run build --prefix launcher/frontend
          New-Item -ItemType Directory -Force launcher/bin | Out-Null
          Copy-Item -Recurse "${{ runner.temp }}/qqmusic-bundle" launcher/bin/qqmusic
          Push-Location launcher
          go build -mod=mod -o "${{ runner.temp }}/MusicParty-compile-check.exe" .
          if ($LASTEXITCODE -ne 0) { throw 'Windows launcher compilation failed' }
          Pop-Location

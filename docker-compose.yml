services:
  # 1. 网易云音乐 API 服务
  netease-api:
    image: moefurina/ncm-api:latest
    container_name: music-party-netease
    restart: always
    environment:
      - PORT=3000
      - HTTPS=true
    networks:
      - music-net

  # 2. QQ 音乐 API 服务（固定上游版本，随 compose 一起构建）
  qqmusic-api:
    image: music-party-qqmusic-api:c046788
    build:
      context: https://github.com/L-1124/QQMusicApi.git#c046788dd1f11daacc74da487cbbf1bcd8ac6f33
      dockerfile: web/Dockerfile
    container_name: music-party-qqmusic
    restart: always
    environment:
      - QQMUSIC_SERVER_HOST=0.0.0.0
    networks:
      - music-net

  # 3. Music Party 主应用
  music-party:
    image: thornex/music-party:latest
    container_name: music-party-app
    restart: always
    ports:
      - "8848:8080"
    environment:
      # 管理员密码，用于在搜索框输入指令控制系统
      - ADMIN_PASSWORD=admin123

      # [基础配置]
      - BASE_URL=http://localhost:8848    #你的基础url，用于直播流链接的拼接
      - APP_AUTHOR_NAME=ThorNex      # 页面左上角显示的作者名
      - APP_BACK_WORDS=MUSIC PARTY    # 中间背景装饰文字

      # [音源开关] 需要哪个源就把对应的值改成 true
      - NETEASE_ENABLED=${NETEASE_ENABLED:-false}
      - BILIBILI_ENABLED=${BILIBILI_ENABLED:-false}
      - QQMUSIC_ENABLED=${QQMUSIC_ENABLED:-false}

      # [上游 API 地址]
      - NETEASE_API_URL=http://netease-api:3000
      - QQMUSIC_API_URL=http://qqmusic-api:8080

      # [音源凭据与音质]
      - NETEASE_COOKIE=""            # 网易云 Cookie
      - NETEASE_QUALITY=exhigh       # 网易云音质 (standard, higher, exhigh, lossless, hires)
      - BILIBILI_COOKIE=""           # B站完整Cookie(可选，仅B站源需要)
      - QQMUSIC_COOKIE=${QQMUSIC_COOKIE:-}
      - QQMUSIC_QUALITY=${QQMUSIC_QUALITY:-MP3_320}

      # [交付方式]
      - NETEASE_DELIVERY_MODE=DIRECT_URL
      - BILIBILI_DELIVERY_MODE=SERVER_DOWNLOAD
      - QQMUSIC_DELIVERY_MODE=${QQMUSIC_DELIVERY_MODE:-DIRECT_URL}
      - PRIVATE_DJ_SOURCE=${PRIVATE_DJ_SOURCE:-netease}

      # [性能/策略配置]
      - QUEUE_MAX_SIZE=1000          # 播放队列最大长度
      - QUEUE_HISTORY_SIZE=50        # 历史记录保留数量
      - PLAYLIST_IMPORT_LIMIT=100    # 导入歌单时的最大歌曲数限制
      - CHAT_HISTORY_LIMIT=1000      # 聊天历史记录保留数量
      - CACHE_MAX_SIZE=1GB           # 本地音乐缓存上限 (例如 512MB, 1GB, 2GB)

      # [防滥用配置]
      - QUEUE_MAX_USER_SONGS=100     # 单用户最大点歌数
      - CHAT_MIN_INTERVAL=1000       # 聊天间隔 (毫秒)
      - CHAT_MAX_LENGTH=200          # 聊天最大长度
      - AUTH_RATE_LIMIT_ENABLED=true # 是否开启密码限流
      - AUTH_MAX_ATTEMPTS=5          # 密码最大尝试次数
      - AUTH_WINDOW_SECONDS=60       # 密码尝试窗口 (秒)
      - AUTH_BLOCK_DURATION=300      # 密码封锁时间 (秒)

    depends_on:
      - netease-api
      - qqmusic-api
    networks:
      - music-net
    volumes:
      # 挂载音频缓存目录，防止重启后 B 站歌曲重新下载
      - ./music_party/cached_media:/app/cached_media
      # 挂载数据目录，用于持久化播放列表和历史记录
      - ./music_party/data:/app/data

networks:
  music-net:
    driver: bridge
